<text x="64" y="132" font-size="54" fill="#17233b" font-weight="700">8 cách học cùng ChatGPT</text>
<text x="64" y="178" font-size="25" fill="#536582" font-weight="400">Chọn cách phù hợp với việc bạn đang cần làm.</text>
