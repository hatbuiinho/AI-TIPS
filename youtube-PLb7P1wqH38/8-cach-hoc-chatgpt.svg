<text x="776" y="417" font-size="13" fill="#0891b2" font-weight="700">CÂU LỆNH MẪU · BIÊN SOẠN THÊM</text>
<text x="776" y="445" font-size="19" fill="#43516b" font-weight="400">Tạo Mind Map về [chủ đề], chia nhánh chính, nhánh phụ</text>
<text x="776" y="470" font-size="19" fill="#43516b" font-weight="400">và mối liên hệ.</text>
