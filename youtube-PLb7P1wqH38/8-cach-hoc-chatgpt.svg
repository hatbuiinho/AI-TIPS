<text x="817" y="262" font-size="16" fill="#0891b2" font-weight="700">KẾT NỐI Ý TƯỞNG</text>
<text x="1282" y="262" font-size="16" fill="#687891" font-weight="400">00:30</text>
<text x="766" y="313" font-size="31" fill="#17233b" font-weight="700">/MINDMAP</text>
<text x="766" y="351" font-size="21" fill="#43516b" font-weight="400">Sắp xếp ý rời rạc thành sơ đồ tư duy.</text>
