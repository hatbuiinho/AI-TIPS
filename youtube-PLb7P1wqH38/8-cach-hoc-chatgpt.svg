<text x="817" y="926" font-size="16" fill="#ea580c" font-weight="700">GIẢI THÍCH ĐỂ HIỂU</text>
<text x="1282" y="926" font-size="16" fill="#687891" font-weight="400">01:21</text>
<text x="766" y="977" font-size="31" fill="#17233b" font-weight="700">/FEYNMAN</text>
<text x="766" y="1015" font-size="21" fill="#43516b" font-weight="400">Diễn đạt lại khái niệm bằng ngôn ngữ đơn giản.</text>
