<text x="776" y="777" font-size="19" fill="#43516b" font-weight="400">Quiz Me về [chủ đề]. Hỏi từng câu, chờ tôi trả lời rồi</text>
<text x="776" y="802" font-size="19" fill="#43516b" font-weight="400">nhận xét.</text>
