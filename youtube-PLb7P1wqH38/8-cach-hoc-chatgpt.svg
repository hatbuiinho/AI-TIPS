<text x="92" y="645" font-size="31" fill="#17233b" font-weight="700">/SCHEMATIC</text>
<text x="92" y="683" font-size="21" fill="#43516b" font-weight="400">Dùng sơ đồ khối để mô tả các bước vận hành.</text>
