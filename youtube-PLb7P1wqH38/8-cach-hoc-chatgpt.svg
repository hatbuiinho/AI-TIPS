<text x="143" y="262" font-size="16" fill="#2563eb" font-weight="700">TÓM TẮT BẰNG HÌNH</text>
<text x="608" y="262" font-size="16" fill="#687891" font-weight="400">00:17</text>
<text x="92" y="313" font-size="31" fill="#17233b" font-weight="700">/VISUALSTUDYGUIDE</text>
<text x="92" y="351" font-size="21" fill="#43516b" font-weight="400">Biến tài liệu dài thành trang tóm tắt trực quan.</text>
