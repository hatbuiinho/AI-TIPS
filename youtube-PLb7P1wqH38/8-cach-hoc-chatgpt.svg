<text x="102" y="777" font-size="19" fill="#43516b" font-weight="400">Vẽ sơ đồ khối cho [quy trình], có đầu vào, từng bước</text>
<text x="102" y="802" font-size="19" fill="#43516b" font-weight="400">và đầu ra.</text>
