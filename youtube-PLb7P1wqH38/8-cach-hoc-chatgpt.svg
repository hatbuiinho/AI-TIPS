<text x="102" y="445" font-size="19" fill="#43516b" font-weight="400">Tạo Visual Study Guide về [chủ đề], gồm ý chính, hình</text>
<text x="102" y="470" font-size="19" fill="#43516b" font-weight="400">minh họa và ví dụ.</text>
