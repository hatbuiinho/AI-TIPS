<text x="817" y="594" font-size="16" fill="#65a30d" font-weight="700">TỰ KIỂM TRA</text>
<text x="1282" y="594" font-size="16" fill="#687891" font-weight="400">00:53</text>
<text x="766" y="645" font-size="31" fill="#17233b" font-weight="700">/QUIZME</text>
<text x="766" y="683" font-size="21" fill="#43516b" font-weight="400">Trả lời từng câu hỏi để tìm lỗ hổng kiến thức.</text>
