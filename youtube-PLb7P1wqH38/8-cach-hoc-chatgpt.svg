<text x="102" y="1109" font-size="19" fill="#43516b" font-weight="400">Áp dụng 80/20 cho [chủ đề]: chọn ý cốt lõi và giải</text>
<text x="102" y="1134" font-size="19" fill="#43516b" font-weight="400">thích vì sao nên học trước.</text>
