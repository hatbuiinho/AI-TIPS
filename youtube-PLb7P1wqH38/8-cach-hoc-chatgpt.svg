<text x="776" y="1109" font-size="19" fill="#43516b" font-weight="400">Cho tôi giải thích [khái niệm] bằng lời dễ hiểu; chỉ</text>
<text x="776" y="1134" font-size="19" fill="#43516b" font-weight="400">ra chỗ sai hoặc còn thiếu.</text>
